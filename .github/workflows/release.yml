name: Build and publish
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the verified artifacts to PyPI
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.19'
          python-version: '3.12'

      - name: Build wheel from source archive
        run: python tools/build.py
      - name: Verify release artifacts
        run: |
          python tools/verify.py dist
          uvx --from twine==7.0.0 twine check --strict dist/*.whl dist/*.tar.gz
      - name: Test isolated wheel installation
        run: |
          for version in 3.11 3.12 3.13; do
            uv venv "$RUNNER_TEMP/wheel-test-$version" --python "$version"
            uv pip install --python "$RUNNER_TEMP/wheel-test-$version/bin/python" --only-binary meltygui-imgui --find-links dist meltygui-imgui==2.0.0.post3
            "$RUNNER_TEMP/wheel-test-$version/bin/python" -I tools/smoke.py
          done
      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: |
            dist/*.whl
            dist/*.tar.gz
            dist/build.json
            dist/auditwheel.txt
  windows:
    needs: build
    runs-on: windows-2022
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.19'
          python-version: '3.12'
      # The Windows wheels compile the same source archive the Linux job built.
      - uses: actions/download-artifact@v4
        with:
          name: release
          path: linux
      - name: Build wheels from source archive
        run: |
          mkdir dist
          cp linux/*.tar.gz dist/
          python tools/build_windows.py
      - name: Verify release artifacts
        run: |
          python tools/verify.py dist --platform windows
          uvx --from twine==7.0.0 twine check --strict dist/*.whl
      - name: Test isolated wheel installation
        run: |
          for version in 3.11 3.12 3.13; do
            uv venv "$RUNNER_TEMP/wheel-test-$version" --python "$version"
            uv pip install --python "$RUNNER_TEMP/wheel-test-$version/Scripts/python.exe" --only-binary meltygui-imgui --find-links dist meltygui-imgui==2.0.0.post3
            "$RUNNER_TEMP/wheel-test-$version/Scripts/python.exe" -I tools/smoke.py
          done
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: |
            dist/*.whl
            dist/build-windows.json
            dist/delvewheel.txt
  publish:
    needs: [build, windows]
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish)
    runs-on: ubuntu-22.04
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release*
          merge-multiple: true
          path: dist
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.19'
      - name: Publish to PyPI
        run: uv publish --trusted-publishing always --check-url https://pypi.org/simple dist/*.whl dist/*.tar.gz
